{% set version = "0.2.1" %}

package:
  name: conda-self
  version: {{ version }}

source:
  url: https://github.com/conda-incubator/conda-self/archive/{{ version }}.tar.gz
  sha256: 519e5e17505e8022a7a3c1d5de3b57a1780c29e80c2c0b203a16d8820725bc35

build:
  number: 0
  noarch: python
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script:
    - python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - hatchling >=1.12.2
    - hatch-vcs >=0.2.0
  run:
    - python >={{ python_min }}
    - conda >=26.1.1

test:
  requires:
    - python {{ python_min }}.*
  imports:
    - conda_self
  commands:
    - conda self --help

about:
  home: https://github.com/conda-incubator/conda-self
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A `self` command for conda
  dev_url: https://github.com/conda-incubator/conda-self

extra:
  recipe-maintainers:
    - jezdez
    - jaimergp
    - soapy1
